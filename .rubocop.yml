# Mirrors the innoq.com-cms house style so the gem stays consistent with the
# codebase that consumes it.
AllCops:
  TargetRubyVersion: 3.2
  NewCops: enable
  SuggestExtensions: false

# The Bundler auto-require entrypoint must be named after the gem (bunnycdn-rails),
# so its hyphen is unavoidable and not a snake_case violation.
Naming/FileName:
  Exclude:
    - lib/bunnycdn-rails.rb

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

# Comments use → arrows to show Cloudinary→Bunny mappings.
Style/AsciiComments:
  Enabled: false

Style/Documentation:
  Enabled: false

Metrics/AbcSize:
  Enabled: false
Metrics/BlockLength:
  Enabled: false
Metrics/ClassLength:
  Enabled: false
Metrics/CyclomaticComplexity:
  Enabled: false
Metrics/MethodLength:
  Enabled: false
Metrics/ModuleLength:
  Enabled: false
Metrics/ParameterLists:
  Enabled: false
Metrics/PerceivedComplexity:
  Enabled: false
